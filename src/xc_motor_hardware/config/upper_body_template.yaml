# 上半身模板：头部 motor_id 必须在获得硬件资料后填写，以下占位值不能直接用于上电。
hardware:
  protocol: sanpo_custom_v3
  can_interface: can0
  bitrate: 1000000
  encoder_counts_per_rev: 16384
  position_count_reference: motor_shaft
  feedback_rate_hz: 20
  state_timeout_ms: 250
  response_timeout_ms: 100
  deactivate_action: none
  joints:
    - {name: right_arm_Joint1, motor_id: 34, gear_ratio: 3.0, direction: 1, joint_offset_rad: 0.0, encoder_zero_count: 0}
    - {name: right_arm_Joint2, motor_id: 57, gear_ratio: 3.0, direction: 1, joint_offset_rad: 0.0, encoder_zero_count: 0}
    - {name: right_arm_Joint3, motor_id: 14, gear_ratio: 4.0, direction: 1, joint_offset_rad: 0.0, encoder_zero_count: 0}
    - {name: right_arm_Joint4, motor_id: 32, gear_ratio: 4.2, direction: 1, joint_offset_rad: 0.0, encoder_zero_count: 0}
    - {name: right_arm_Joint5, motor_id: 21, gear_ratio: 1.0, direction: 1, joint_offset_rad: 0.0, encoder_zero_count: 0}
    - {name: left_arm_Joint1, motor_id: 59, gear_ratio: 3.0, direction: 1, joint_offset_rad: 0.0, encoder_zero_count: 0}
    - {name: left_arm_Joint2, motor_id: 58, gear_ratio: 3.0, direction: 1, joint_offset_rad: 0.0, encoder_zero_count: 0}
    - {name: left_arm_Joint3, motor_id: 31, gear_ratio: 4.0, direction: 1, joint_offset_rad: 0.0, encoder_zero_count: 0}
    - {name: left_arm_Joint4, motor_id: 17, gear_ratio: 4.2, direction: 1, joint_offset_rad: 0.0, encoder_zero_count: 0}
    - {name: left_arm_Joint5, motor_id: 19, gear_ratio: 1.0, direction: 1, joint_offset_rad: 0.0, encoder_zero_count: 0}
    # TODO: 获得真实协议和地址后取消注释，并填写唯一 motor_id。
    # - {name: head_Joint1, motor_id: <填写>, gear_ratio: 1.0, direction: 1, joint_offset_rad: 0.0, encoder_zero_count: 0}
    # - {name: head_Joint2, motor_id: <填写>, gear_ratio: 1.0, direction: 1, joint_offset_rad: 0.0, encoder_zero_count: 0}


